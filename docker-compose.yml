services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: merasehar-db
    environment:
      POSTGRES_DB: merasehar
      POSTGRES_USER: merasehar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merasehar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: merasehar-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://merasehar:${POSTGRES_PASSWORD}@db:5432/merasehar
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      AUTHORITY_ACCESS_CODE: ${AUTHORITY_ACCESS_CODE:-}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      PORT: 8000
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: merasehar-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
