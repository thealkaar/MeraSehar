version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: merasehar-db
    environment:
      POSTGRES_DB: merasehar
      POSTGRES_USER: merasehar
      POSTGRES_PASSWORD: merasehar_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merasehar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: merasehar-backend
    environment:
      DATABASE_URL: postgresql://merasehar:merasehar_secret@db:5432/merasehar
      SECRET_KEY: production-secret-key-change-me
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: merasehar-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
